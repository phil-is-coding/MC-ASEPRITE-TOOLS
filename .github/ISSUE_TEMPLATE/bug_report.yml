name: Bug report
description: Something is broken or not working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? Add a screenshot if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a 64x64 skin
        2. View > MC Aseprite Tools > View Skin
        3. ...
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown in Edit > Preferences > Extensions.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: aseprite-version
    attributes:
      label: Aseprite version
      description: Help > About.
      placeholder: "1.3.18"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        Any error text from Aseprite's console. If it only happens with one
        skin, attach the skin. If it's slow, turn on "Show timings" and
        include the numbers.
