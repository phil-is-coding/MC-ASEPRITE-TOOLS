name: Feature request
description: Something you would like the extension to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Take a look at [SCOPE.md](https://github.com/phil-is-coding/MC-ASEPRITE-TOOLS/blob/master/SCOPE.md)
        first. It lists a few things this project isn't going to do.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What were you working on when you wanted this?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
